name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standard-contract:
    name: Standard contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install Claude Code validator
        run: npm install --global @anthropic-ai/claude-code@2.1.241

      - name: Install verified MCP SDK
        run: python -m pip install "mcp>=1.28.1,<2"

      - name: Verify Standard contract
        run: python scripts/verify_standard_contract.py

      - name: Verify quickstart SDK compatibility
        run: python -m scripts.verify_quickstart

      - name: Compile Python sources
        run: python -m compileall -q examples scripts

      - name: Parse JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = sorted(Path(".").rglob("*.json"))
          if not paths:
              raise SystemExit("No JSON files found")
          for path in paths:
              json.loads(path.read_text(encoding="utf-8"))
          print(f"PASS: parsed {len(paths)} JSON files")
          PY

      - name: Validate Claude plugin
        run: claude plugin validate --strict plugins/adamas-research-report

      - name: Validate Claude marketplace
        run: claude plugin validate --strict .claude-plugin/marketplace.json
